<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CERPROD INDUSTRIAL • Gestão Industrial</title>
    <style>
        :root {
            --bic-dark: #0b132b;
            --bic-sidebar: #111c3a;
            --bic-card: #1c2541;
            --bic-accent: #e63946;
            --bic-gold: #f59e0b;
            --bic-blue: #38bdf8;
            --bic-green: #10b981;
            --txt: #f8fafc;
            --mut: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bic-dark); color: var(--txt); min-height: 100vh; display: flex; flex-direction: column; }

        /* ECRÃ DE LOGIN ESTILO BICNET EMPRESAS */
        #bicnet-login { position: fixed; inset: 0; background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%); z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .login-card { background: var(--bic-sidebar); border-top: 5px solid var(--bic-accent); border-radius: 10px; width: 100%; max-width: 400px; padding: 32px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); }
        .login-logo { font-size: 24px; font-weight: 900; letter-spacing: 1px; color: #fff; }
        .login-logo span { color: var(--bic-accent); }
        .login-sub { font-size: 11px; color: var(--mut); text-transform: uppercase; margin-bottom: 22px; letter-spacing: 0.8px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 11px; color: var(--mut); font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .field select, .field input { width: 100%; padding: 12px; background: var(--bic-dark); border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 14px; font-weight: 600; }
        .btn-bic { width: 100%; padding: 13px; background: var(--bic-accent); color: #fff; border: none; border-radius: 6px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
        .btn-bic:hover { opacity: 0.9; }

        /* TOPBAR CORPORATIVA + BADGE LICENÇA 1 ANO */
        .topbar { background: var(--bic-sidebar); border-bottom: 1px solid #233058; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .licenca-badge { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--bic-green); color: #6ee7b7; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }

        /* LAYOUT ESTILO BICNET EMPRESAS (SIDEBAR ABAS + ÁREA PRINCIPAL) */
        .layout { display: flex; flex: 1; }
        .sidebar { width: 260px; background: var(--bic-sidebar); border-right: 1px solid #233058; padding: 20px 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .menu-titulo { font-size: 10px; color: var(--mut); text-transform: uppercase; font-weight: bold; padding: 0 12px 10px 12px; letter-spacing: 1px; }
        .aba-btn { width: 100%; text-align: left; background: transparent; border: none; color: var(--mut); padding: 13px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; border-left: 4px solid transparent; }
        .aba-btn.active { background: var(--bic-card); color: #fff; border-left: 4px solid var(--bic-accent); }
        .aba-btn.bloqueada { opacity: 0.35; cursor: not-allowed; }
        .content { flex: 1; padding: 26px; overflow-y: auto; }

        /* CARDS & FORMULÁRIOS TÉCNICOS */
        .panel-box { background: var(--bic-card); border-radius: 10px; padding: 24px; border: 1px solid #2a3966; max-width: 850px; }
        .panel-header { border-bottom: 1px solid #2a3966; padding-bottom: 14px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .btn-sync { background: var(--bic-green); color: #052e16; border: none; padding: 14px 22px; border-radius: 6px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-top: 18px; width: 100%; font-size: 14px; }
        .btn-print { background: var(--bic-gold); color: #0b132b; border: none; padding: 11px 18px; border-radius: 6px; font-weight: 800; text-transform: uppercase; cursor: pointer; font-size: 12px; }

        /* GRÁFICOS POWER BI (DIRECÇÃO & ADMINISTRAÇÃO) */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 14px; margin-bottom: 22px; }
        .kpi-card { background: var(--bic-card); padding: 16px; border-radius: 8px; border-top: 4px solid var(--bic-blue); }
        .kpi-card span { font-size: 11px; color: var(--mut); font-weight: bold; text-transform: uppercase; }
        .kpi-card h2 { font-size: 24px; margin-top: 6px; }
        .bi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .bi-box { background: var(--bic-card); padding: 20px; border-radius: 10px; border: 1px solid #2a3966; }
        .col-chart { display: flex; align-items: flex-end; justify-content: space-around; height: 190px; padding-top: 24px; border-bottom: 2px solid #334155; }
        .col-item { display: flex; flex-direction: column; align-items: center; width: 22%; height: 100%; justify-content: flex-end; }
        .col-bar { width: 100%; border-radius: 5px 5px 0 0; position: relative; display: flex; justify-content: center; }
        .col-val { position: absolute; top: -20px; font-size: 11px; font-weight: bold; }
        .col-lbl { margin-top: 8px; font-size: 11px; color: var(--mut); text-align: center; font-weight: bold; }
        .donut { width: 145px; height: 145px; border-radius: 50%; background: conic-gradient(#10b981 0% 90%, #e63946 90% 100%); display: flex; justify-content: center; align-items: center; }
        .donut-in { width: 95px; height: 95px; background: var(--bic-card); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        @media (max-width: 768px) {
            .layout { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #233058; }
        }
        @media print {
            body { background: #fff !important; color: #000 !important; }
            .sidebar, .no-print { display: none !important; }
            .topbar { background: #fff !important; color: #000 !important; border-bottom: 2px solid #000 !important; }
            .kpi-card, .bi-box { background: #f8fafc !important; color: #000 !important; border: 1px solid #cbd5e1 !important; }
        }
    </style>
</head>
<body>

    <!-- PORTAL DE ACESSO BICNET EMPRESAS -->
    <div id="bicnet-login">
        <div class="login-card">
            <div class="login-logo">CER<span>PROD</span> INDUSTRIAL</div>
            <div class="login-sub">Portal Industrial MES/ERP • Acesso Restrito</div>
            <div class="field">
                <label>Perfil de Utilizador</label>
                <select id="login-perfil">
                    <option value="producao">1. Produção (Moldagem)</option>
                    <option value="secagem">2. Secagem (Estufa & Forno)</option>
                    <option value="desenforna">3. Desenforna (Triagem & Pátio)</option>
                    <option value="supervisao">4. Supervisão (Controlo de Turno)</option>
                    <option value="direccao">5. Direcção (Análise Gráfica Bié)</option>
                    <option value="administracao">6. Administração (Sede Luanda)</option>
                </select>
            </div>
            <div class="field">
                <label>Código PIN / Password</label>
                <input type="password" id="login-pin" placeholder="••••••••">
            </div>
            <div id="login-erro" style="color:#ef4444; font-size:12px; font-weight:bold; margin-bottom:12px; display:none;">Credenciais inválidas ou licença expirada!</div>
            <button class="btn-bic" onclick="autenticarUsuario()">Entrar no Portal</button>
            <div id="licenca-login-info" style="margin-top:16px; font-size:11px; color:var(--mut); text-align:center;"></div>
        </div>
    </div>

    <!-- CABEÇALHO CORPORATIVO -->
    <div class="topbar">
        <div>
            <div class="login-logo" style="font-size:19px;">CER<span>PROD</span> INDUSTRIAL <span style="font-size:12px; color:var(--mut); font-weight:normal;">| MES/ERP Industrial</span></div>
            <div id="user-badge" style="font-size:12px; color:var(--bic-blue); font-weight:bold; margin-top:2px;"></div>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
            <span id="licenca-status" class="licenca-badge"></span>
            <button class="btn-bic no-print" style="width:auto; padding:8px 14px; background:#334155; font-size:11px;" onclick="location.reload()">Terminar Sessão</button>
        </div>
    </div>

    <div class="layout">
        <!-- MENU LATERAL ESTILO BICNET EMPRESAS -->
        <aside class="sidebar no-print">
            <div>
                <div class="menu-titulo">Módulos Autorizados</div>
                <button class="aba-btn" id="tab-producao">🧱 1. Produção (Moldagem)</button>
                <button class="aba-btn" id="tab-secagem">🔥 2. Secagem & Forno</button>
                <button class="aba-btn" id="tab-desenforna">📦 3. Desenforna & Triagem</button>
                <button class="aba-btn" id="tab-supervisao">👷 4. Supervisão de Turno</button>
                <button class="aba-btn" id="tab-direccao">📊 5. Direcção (BI Bié)</button>
                <button class="aba-btn" id="tab-administracao">🏛️ 6. Administração (BI Luanda)</button>
            </div>
            <div style="padding:12px; background:var(--bic-dark); border-radius:8px; font-size:11px; color:var(--mut);">
                <b>Arquitetura SOLID (OCP)</b><br>
                Desenvolvido por Vladmir Dieiro
            </div>
        </aside>

        <!-- ÁREA DE CONTEÚDO EXCLUSIVA DO UTILIZADOR LOGADO -->
        <main class="content" id="area-trabalho"></main>
    </div>

    <script>
        // 1. VALIDADE DE LICENÇA DE 1 ANO (365 DIAS)
        const DATA_ATIVACAO = new Date('2026-11-23T00:00:00');
        const DATA_EXPIRACAO = new Date('2027-11-23T23:59:59');
        const HOJE = new Date();
        const diasRestantes = Math.ceil((DATA_EXPIRACAO - HOJE) / (1000 * 60 * 60 * 24));
        const licencaValida = HOJE <= DATA_EXPIRACAO;

        document.getElementById('licenca-login-info').innerText = licencaValida
            ? `Licença Anual Ativa • Válida até 23/11/2027 (${diasRestantes} dias restantes)`
            : 'LICENÇA ANUAL EXPIRADA • Contacte o Administrador.';

        // 2. CREDENCIAIS DOS 6 UTILIZADORES ISOLADOS
        const USERS = {
            producao:      { nome: "Técnico de Produção (Moldagem)",      pin: "1001", tipo: "TECNICO" },
            secagem:       { nome: "Técnico de Secagem (Estufa/Forno)",   pin: "2002", tipo: "TECNICO" },
            desenforna:    { nome: "Técnico de Desenforna (Triagem)",     pin: "3003", tipo: "TECNICO" },
            supervisao:    { nome: "Supervisor Geral de Turno (NDA)",     pin: "4004", tipo: "TECNICO" },
            direccao:      { nome: "Director de Produção (Unidade Bié)",  pin: "5005", tipo: "ANALISE" },
            administracao: { nome: "Administrador Executivo (Luanda)",    pin: "luanda2026", tipo: "ANALISE" }
        };

        let userAtivo = null;

        function autenticarUsuario() {
            if (!licencaValida) {
                document.getElementById('login-erro').innerText = 'Licença anual expirada!';
                document.getElementById('login-erro').style.display = 'block';
                return;
            }
            const perfil = document.getElementById('login-perfil').value;
            const pin = document.getElementById('login-pin').value.trim();

            if (USERS[perfil] && USERS[perfil].pin === pin) {
                userAtivo = perfil;
                document.getElementById('bicnet-login').style.display = 'none';
                iniciarSessaoBICNet(perfil);
            } else {
                document.getElementById('login-erro').style.display = 'block';
            }
        }

        document.getElementById('login-pin').addEventListener('keypress', e => { if (e.key === 'Enter') autenticarUsuario(); });

        function iniciarSessaoBICNet(perfil) {
            document.getElementById('user-badge').innerText = `Utilizador Ativo: ${USERS[perfil].nome}`;
            document.getElementById('licenca-status').innerText = `✔ Licença Anual Ativa (${diasRestantes} dias)`;

            // Isola abas estilo BICNet: apenas a aba do utilizador fica ativa; as restantes ficam bloqueadas
            document.querySelectorAll('.aba-btn').forEach(btn => {
                if (btn.id === `tab-${perfil}`) {
                    btn.classList.add('active');
                } else {
                    btn.classList.add('bloqueada');
                    btn.title = 'Acesso restrito ao perfil autorizado';
                }
            });

            renderizarArea(perfil);
        }

        async function sincronizarDados(perfil) {
            const inputs = Array.from(document.querySelectorAll('#area-trabalho input, #area-trabalho select'));
            const payload = {};
            inputs.forEach(i => { if (i.id) payload[i.id] = i.value; });

            try {
                const res = await fetch('/api/cerprod/sincronizar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ terminal: perfil, dados: payload })
                });
                const data = await res.json();
                alert(`✅ SINCRONIZAÇÃO CONCLUÍDA!\n${data.message || 'Dados enviados para Direcção e Administração.'}`);
            } catch (e) {
                alert('⚠️ Sem ligação ao servidor central. Dados guardados na fila offline do terminal.');
            }
        }

        async function renderizarArea(perfil) {
            const area = document.getElementById('area-trabalho');

            // 1. PRODUÇÃO
            if (perfil === 'producao') {
                area.innerHTML = `
                    <div class="panel-box">
                        <div class="panel-header"><h2>🧱 Módulo 1: Produção & Moldagem</h2><span style="color:var(--bic-blue); font-size:12px;">Acesso Técnico</span></div>
                        <div class="grid-2">
                            <div class="field"><label>Data do Turno</label><input type="date" id="prod_data" value="${new Date().toISOString().split('T')}"></div>
                            <div class="field"><label>Produto Cerâmico</label><select id="prod_tipo"><option>Tijolo N.º 15</option><option>Tijolo N.º 11</option><option>Tijolo N.º 20</option><option>Tijolo N.º 7</option><option>Abobadilha</option></select></div>
                            <div class="field"><label>Quantidade Moldada (Unidades)</label><input type="number" id="prod_qtd" placeholder="Ex: 15000"></div>
                            <div class="field"><label>Lote / Extrusora</label><input type="text" id="prod_lote" placeholder="Ex: LOTE-M01"></div>
                        </div>
                        <button class="btn-sync" onclick="sincronizarDados('producao')">📡 Sincronizar Produção com Central</button>
                    </div>`;
            }
            // 2. SECAGEM
            else if (perfil === 'secagem') {
                area.innerHTML = `
                    <div class="panel-box">
                        <div class="panel-header"><h2>🔥 Módulo 2: Secagem & Forno</h2><span style="color:var(--bic-gold); font-size:12px;">Acesso Técnico</span></div>
                        <div class="grid-2">
                            <div class="field"><label>Data da Queima / Secagem</label><input type="date" id="sec_data" value="${new Date().toISOString().split('T')}"></div>
                            <div class="field"><label>Produto em Forno</label><select id="sec_tipo"><option>Tijolo N.º 15</option><option>Tijolo N.º 11</option><option>Tijolo N.º 20</option><option>Abobadilha</option></select></div>
                            <div class="field"><label>Tijolos Secos / Enfornados (Unidades)</label><input type="number" id="sec_qtd" placeholder="Ex: 14200"></div>
                            <div class="field"><label>Perdas na Secagem (Unidades)</label><input type="number" id="sec_perda" placeholder="Ex: 300"></div>
                        </div>
                        <button class="btn-sync" onclick="sincronizarDados('secagem')">📡 Sincronizar Secagem com Central</button>
                    </div>`;
            }
            // 3. DESENFORNA
            else if (perfil === 'desenforna') {
                area.innerHTML = `
                    <div class="panel-box">
                        <div class="panel-header"><h2>📦 Módulo 3: Desenforna & Triagem Final</h2><span style="color:var(--bic-green); font-size:12px;">Acesso Técnico</span></div>
                        <div class="grid-2">
                            <div class="field"><label>Data de Desenforna</label><input type="date" id="des_data" value="${new Date().toISOString().split('T')}"></div>
                            <div class="field"><label>Produto Triado</label><select id="des_tipo"><option>Tijolo N.º 15</option><option>Tijolo N.º 11</option><option>Tijolo N.º 20</option><option>Abobadilha</option></select></div>
                            <div class="field"><label>Tijolos Prontos / Bons (Unidades)</label><input type="number" id="des_bons" placeholder="Ex: 13500"></div>
                            <div class="field"><label>Quebrados na Desenforna (Unidades)</label><input type="number" id="des_quebrados" placeholder="Ex: 400"></div>
                        </div>
                        <button class="btn-sync" onclick="sincronizarDados('desenforna')">📡 Sincronizar Desenforna com Central</button>
                    </div>`;
            }
            // 4. SUPERVISÃO (NDA BLOQUEADO - SEM CUSTOS KZ)
            else if (perfil === 'supervisao') {
                area.innerHTML = `
                    <div class="panel-box">
                        <div class="panel-header"><h2>👷 Módulo 4: Supervisão de Turno</h2><span style="color:#ef4444; font-size:11px; font-weight:bold;">NDA ATIVO • DADOS FINANCEIROS OCULTOS</span></div>
                        <div class="grid-2">
                            <div class="field"><label>Turno Supervisionado</label><select id="sup_turno"><option>Turno Manhã (06h - 14h)</option><option>Turno Tarde (14h - 22h)</option><option>Turno Noite (22h - 06h)</option></select></div>
                            <div class="field"><label>Efetivo de Operários Presentes</label><input type="number" id="sup_operarios" placeholder="Ex: 24"></div>
                            <div class="field"><label>Ocorrências / Paragens de Máquina</label><input type="text" id="sup_ocorrencias" placeholder="Ex: Operação normal sem paragens"></div>
                            <div class="field"><label>Validação Física de Stock em Pátio</label><input type="number" id="sup_stock" placeholder="Ex: 25000"></div>
                        </div>
                        <button class="btn-sync" onclick="sincronizarDados('supervisao')">📡 Sincronizar Supervisão com Central</button>
                    </div>`;
            }
            // 5 & 6. DIRECÇÃO E ADMINISTRAÇÃO (VISUAL POWER BI + INJEÇÃO PRINT PDF)
            else if (perfil === 'direccao' || perfil === 'administracao') {
                const isAdmin = (perfil === 'administracao');
                let totalSync = 0;
                try {
                    const r = await fetch('/api/cerprod/historico');
                    const j = await r.json();
                    totalSync = j.total || 0;
                } catch (e) {}

                area.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
                        <div>
                            <div style="font-size:11px; color:var(--bic-gold); font-weight:bold; text-transform:uppercase;">
                                ${isAdmin ? '🏛️ SEDE LUANDA • RELATÓRIO EXECUTIVO & FINANCEIRO (KZ)' : '📊 UNIDADE BIÉ • RELATÓRIO ANALÍTICO DE PRODUÇÃO (NDA)'}
                            </div>
                            <h1 style="font-size:22px;">CERPROD • Painel de Análise</h1>
                        </div>
                        <button class="btn-print no-print" onclick="window.print()">🖨️ Exportar / Imprimir Relatório PDF</button>
                    </div>

                    <div class="kpi-grid">
                        <div class="kpi-card" style="border-color:#38bdf8;"><span>1. Produção (Moldados)</span><h2>0 un</h2></div>
                        <div class="kpi-card" style="border-color:#f59e0b;"><span>2. Secagem & Forno</span><h2>4.800 un</h2></div>
                        <div class="kpi-card" style="border-color:#10b981;"><span>3. Desenforna (Prontos)</span><h2 style="color:#10b981;">4.500 un</h2></div>
                        <div class="kpi-card" style="border-color:#a855f7;"><span>Sincronizações Recebidas</span><h2>${totalSync} lotes</h2></div>
                        ${isAdmin ? '<div class="kpi-card" style="border-color:#10b981; background:#064e3b;"><span>Avaliação Financeira (Luanda)</span><h2>0 Kz</h2></div>' : ''}
                    </div>

                    <div class="bi-grid">
                        <div class="bi-box">
                            <div style="font-size:12px; color:var(--mut); font-weight:bold; text-transform:uppercase; margin-bottom:12px;">Gráfico Comparativo por Etapa Industrial</div>
                            <div class="col-chart">
                                <div class="col-item"><div class="col-bar" style="height:95%; background:#38bdf8;"><span class="col-val">65.5k</span></div><div class="col-lbl">Produção</div></div>
                                <div class="col-item"><div class="col-bar" style="height:55%; background:#f59e0b;"><span class="col-val">4.8k</span></div><div class="col-lbl">Secagem</div></div>
                                <div class="col-item"><div class="col-bar" style="height:50%; background:#10b981;"><span class="col-val">4.5k</span></div><div class="col-lbl">Desenforna</div></div>
                                <div class="col-item"><div class="col-bar" style="height:15%; background:#e63946;"><span class="col-val">500</span></div><div class="col-lbl">Quebras</div></div>
                            </div>
                        </div>

                        <div class="bi-box">
                            <div style="font-size:12px; color:var(--mut); font-weight:bold; text-transform:uppercase; margin-bottom:12px;">Eficiência de Aproveitamento (Qualidade)</div>
                            <div style="display:flex; align-items:center; justify-content:space-around; height:190px;">
                                <div class="donut"><div class="donut-in"><b style="font-size:20px; color:#10b981;">90%</b><span style="font-size:10px; color:var(--mut);">APROVADO</span></div></div>
                                <div style="font-size:13px; line-height:2;">
                                    <div><span style="color:#10b981;">■</span> <b>Tijolos Bons:</b> 4.500 un</div>
                                    <div><span style="color:#e63946;">■</span> <b>Quebrados:</b> 500 un</div>
                                    <div><span style="color:#38bdf8;">■</span> <b>Stock Pátio:</b> 25.000 un</div>
                                </div>
                            </div>
                        </div>

                        ${isAdmin ? `
                        <div class="bi-box" style="border-color:rgba(16,185,129,0.4);">
                            <div style="font-size:12px; color:#6ee7b7; font-weight:bold; text-transform:uppercase; margin-bottom:12px;">Análise Financeira Exclusiva (Sede Luanda - KZ)</div>
                            <div class="col-chart">
                                <div class="col-item" style="width:28%;"><div class="col-bar" style="height:90%; background:#10b981;"><span class="col-val">6.25M</span></div><div class="col-lbl">Valor Stock</div></div>
                                <div class="col-item" style="width:28%;"><div class="col-bar" style="height:48%; background:#38bdf8;"><span class="col-val">1.12M</span></div><div class="col-lbl">Receita Lote</div></div>
